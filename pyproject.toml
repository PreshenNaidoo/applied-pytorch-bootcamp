[project]
name = "applied-pytorch-bootcamp"
version = "0.1.0"
description = "Hands-on PyTorch exercises for applied AI and research engineering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "ale-py>=0.11.0",
    "av>=18.0.0",
    "datasets",
    "gym-pusht==0.1.6",
    "gymnasium",
    "httpx>=0.28.1",
    "matplotlib",
    "numpy",
    "opencv-python>=4.12.0",
    "pandas",
    "peft",
    "plotly>=6.0.1",
    "psutil>=7.0.0",
    "pyarrow==22.0.0",
    "pygame>=2.6.1",
    "pymunk<7",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "scikit-learn>=1.8.0",
    "stable-baselines3",
    "tokenizers",
    "torch>=2.1",
    "torchaudio",
    "torchvision",
    "tqdm==4.67.1",
    "transformers",
    "trl",
    "yt-dlp>=2026.6.9",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
